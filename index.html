<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Water Dashboard</title>
  
  <!-- Font Modern (Poppins) & Ikon (FontAwesome) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Library Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --primary-neon: #00f3ff;
      --bg-gradient-1: #0f2027;
      --bg-gradient-2: #203a43;
      --bg-gradient-3: #2c5364;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background: linear-gradient(135deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3));
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .header-container {
      text-align: center;
      margin-bottom: 40px;
    }

    .header-container h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 10px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .live-status {
      display: inline-flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #a8d5e5;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .dot {
      height: 10px;
      width: 10px;
      background-color: #00ff88;
      border-radius: 50%;
      margin-right: 8px;
      box-shadow: 0 0 10px #00ff88;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0, 255, 136, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 255, 136, 0); }
    }

    .dashboard-grid {
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 1000px;
      width: 100%;
    }

    /* Gaya Card Glassmorphism */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px 20px;
      width: 280px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-10px);
      border-color: rgba(0, 243, 255, 0.4);
      box-shadow: 0 15px 40px 0 rgba(0, 243, 255, 0.2);
    }

    /* Efek cahaya halus di atas card */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%; width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%);
      transform: skewX(-25deg);
      transition: all 0.75s;
    }
    .card:hover::before { left: 200%; }

    .icon-wrapper {
      font-size: 2.5rem;
      color: var(--primary-neon);
      margin-bottom: 15px;
      filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.6));
    }

    .card h2 {
      font-size: 1.1rem;
      font-weight: 400;
      color: #b0c4de;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card p {
      font-size: 3.5rem;
      font-weight: 700;
      color: #ffffff;
      margin: 10px 0;
      line-height: 1;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .card span {
      font-size: 0.85rem;
      font-weight: 300;
      color: #88a2b5;
      background: rgba(0,0,0,0.2);
      padding: 5px 12px;
      border-radius: 12px;
    }

    /* Responsif untuk layar HP */
    @media (max-width: 768px) {
      .header-container h1 { font-size: 1.8rem; }
      .card { width: 100%; max-width: 320px; }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1>Monitoring Air IoT</h1>
    <div class="live-status">
      <div class="dot"></div> Sinkronisasi Firebase Aktif
    </div>
  </div>
  
  <div class="dashboard-grid">
    <!-- Card Ketinggian -->
    <div class="card">
      <div class="icon-wrapper"><i class="fa-solid fa-water"></i></div>
      <h2>Ketinggian Air</h2>
      <p id="val-tinggi">0</p>
      <span>Milimeter (mm)</span>
    </div>
    
    <!-- Card Debit -->
    <div class="card">
      <div class="icon-wrapper"><i class="fa-solid fa-faucet-drip"></i></div>
      <h2>Debit Aliran</h2>
      <p id="val-debit">0.00</p>
      <span>Liter / Menit (L/m)</span>
    </div>

    <!-- Card Kecepatan -->
    <div class="card">
      <div class="icon-wrapper"><i class="fa-solid fa-gauge-high"></i></div>
      <h2>Kecepatan</h2>
      <p id="val-kecepatan">0.00</p>
      <span>Meter / Detik (m/s)</span>
    </div>
  </div>

  <script>
    // Konfigurasi Firebase
    var firebaseConfig = {
      apiKey: "AIzaSyBsq499kdB8qPiTIx8l1-VaG3TD7JXVfZU",
      databaseURL: "https://sistemairiot-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();

    // Menarik Data secara Real-Time
    var sensorRef = database.ref('DataSensor');
    
    sensorRef.on('value', function(snapshot) {
      var data = snapshot.val();
      
      if(data) {
        document.getElementById('val-tinggi').innerText = data.Tinggi;
        document.getElementById('val-debit').innerText = parseFloat(data.Debit).toFixed(2);
        document.getElementById('val-kecepatan').innerText = parseFloat(data.Kecepatan).toFixed(2);
      }
    });
  </script>

</body>
</html>
